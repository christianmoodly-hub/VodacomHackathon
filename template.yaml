AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SHE-SHIELD Response brief, decision, and audit API.

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        AUDIT_TABLE_NAME: !Ref AuditLogTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lead_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: lead_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  CreateBriefFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.create_brief.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Converse
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
      Events:
        PostBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /brief

  RecordDecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.record_decision.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
      Events:
        PostDecision:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /decision

  GetAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.get_audit.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt AuditLogTable.Arn
      Events:
        GetAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /audit

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  AuditTable:
    Description: AuditLog table name
    Value: !Ref AuditLogTable
